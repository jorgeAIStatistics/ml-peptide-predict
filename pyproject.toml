[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research"
version = "0.1.0"
description = "Computational pharmacology and systems biology research platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "requests>=2.32",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed to rebuild data/ml/plm_embeddings.npz, which is committed. No
# deployed model uses a neural network; see docs/ATLAS_2.6_PROTEIN_LANGUAGE_MODEL.md
# for the measurement that left these optional rather than required.
plm = ["torch>=2.0", "transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:atlas.*"]
