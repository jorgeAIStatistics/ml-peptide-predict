<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS — Computational Biology Research Instrument</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="%23F6F5F0"/><g fill="none" stroke="%230E6B63" stroke-width="1.3"><circle cx="8" cy="8" r="5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></g></svg>'>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="components.css">
</head>
<body>

<a class="skip" href="#canvas">Skip to workspace</a>

<div class="frame">

  <header class="bar">
    <div class="mark">
      <svg class="reticle" viewBox="0 0 12 12" fill="none" stroke="currentColor"
           stroke-width="1.2" aria-hidden="true">
        <circle cx="6" cy="6" r="4.2"/><path d="M6 0v3M6 9v3M0 6h3M9 6h3"/>
      </svg>
      <span class="mark-word">Atlas</span>
    </div>
    <span class="bar-spacer"></span>
    <div class="readout" id="readout"></div>
    <button class="btn btn-ghost palette-trigger" id="palette-open" type="button"
            title="Search compounds and workspaces (⌘K)">
      <span>Search</span><kbd>⌘K</kbd>
    </button>
    <button class="btn btn-ghost theme-toggle" id="theme-toggle" type="button"
            aria-pressed="false" title="Switch to dark">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <circle cx="8" cy="8" r="3.4"/>
        <path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/>
      </svg>
    </button>
  </header>

  <div class="scope" role="note">
    <span aria-hidden="true">※</span>
    <span id="scope-note">Research platform for literature analysis and computational modelling.</span>
  </div>

  <div class="body">
    <nav class="spine" id="spine" aria-label="Research modules"></nav>
    <main class="canvas" id="canvas" tabindex="-1">
      <div class="specimen-bar" id="specimen-bar" hidden></div>
    </main>
  </div>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <input type="text" id="palette-input" placeholder="Search compounds and workspaces…"
           autocomplete="off" spellcheck="false">
    <ul class="palette-list" id="palette-list"></ul>
    <p class="palette-foot fine muted">Enter to open · Esc to dismiss</p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
